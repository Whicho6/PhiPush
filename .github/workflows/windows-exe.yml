name: windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - run: pyinstaller --clean --noconfirm PhiPush.spec
      - shell: pwsh
        run: Compress-Archive -Path dist/PhiPush.exe -DestinationPath dist/PhiPush-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhiPush-Windows-x64
          path: dist/PhiPush-Windows-x64.zip
          if-no-files-found: error
